<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova AI</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="main-container">

        <!-- =========================
             WELCOME SCREEN
        ========================== -->

        <section class="hero">

            <div class="logo-star">
                ✦
            </div>

            <h1>Nova</h1>

            <h2>
                Hey, I'm Nova 👋
            </h2>

            <p class="subtitle">
                How can I help you today?
            </p>

        </section>


        <!-- =========================
             CHAT MESSAGES
        ========================== -->

        <div
            id="chat-box"
            class="chat-box"
        ></div>


        <!-- =========================
             INPUT SECTION
        ========================== -->

        <section class="input-section">

            <div class="input-box">

                <textarea
                    id="message-input"
                    placeholder="Ask me anything..."
                    rows="1"
                    aria-label="Message"
                ></textarea>


                <div class="input-bottom">

                    <button
                        class="attach-button"
                        type="button"
                        title="Attachments coming soon"
                        aria-label="Attachments"
                    >
                        📎
                    </button>


                    <button
                        id="send-button"
                        class="send-button"
                        type="button"
                        aria-label="Send message"
                    >
                        ➤
                    </button>

                </div>

            </div>


            <div class="hint">

                <span>✦</span>

                <span>
                    Ask about coding, study, ideas, projects and more...
                </span>

            </div>

        </section>

    </main>


    <script src="main.js"></script>

</body>

</html>
